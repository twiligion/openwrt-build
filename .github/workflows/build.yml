name: Build OpenWrt for TL-WR842N-v5

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git Branch / Tag to build'
        required: true
        default: 'openwrt-25.12'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file wget libelf-dev

      - name: Clone OpenWrt source
        run: |
          git clone --single-branch -b ${{ github.event.inputs.branch }} https://github.com/openwrt/openwrt.git openwrt || \
          git clone --single-branch -b main https://github.com/openwrt/openwrt.git openwrt

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Setup config
        run: |
          cp .config openwrt/.config
          cd openwrt
          make defconfig
          sed -i 's/# CONFIG_KERNEL_SWAP is not set/CONFIG_KERNEL_SWAP=y/g' .config
          echo "CONFIG_KERNEL_SWAP=y" >> .config
          make defconfig

      - name: Download source tarballs
        run: |
          cd openwrt
          make download -j8

      - name: Compile firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload sysupgrade artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-tl-wr842n-v5
          path: openwrt/bin/targets/ramips/mt76x8/*sysupgrade.bin
